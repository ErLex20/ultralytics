# YOLO-DLA: hardware-first one-stage detector for convolutional fixed-function accelerators.
# The deployable graph is static NCHW and uses Conv, ReLU/Sigmoid, Pool, Resize,
# Concat, Add, and Product only. Training uses dual assignment; export emits raw
# one-to-one P3/P4/P5 maps through YOLODLADetect with no TopK or NMS in the engine.

# Parameters
nc: 80
end2end: True
reg_max: 1
activation: torch.nn.ReLU(inplace=True)
scale: n
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]

# Fully convolutional YOLO backbone. DLARepCSP uses two independent projections
# instead of Split/Slice and fuses each RepConv to a single 3x3 deploy convolution.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, DLARepCSP, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, DLARepCSP, [512, 0.5]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, DLARepCSP, [512, 0.5]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, DLARepCSP, [1024, 0.5]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, DLALocalContext, [1024, 1.0]] # local data-dependent context, no MatMul/Softmax

# Static PAN neck and dense multi-scale YOLO head.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, DLARepCSP, [512, 0.5]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, DLARepCSP, [256, 0.5]] # 16-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, DLARepCSP, [512, 0.5]] # 19-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, DLARepCSP, [1024, 0.5]] # 22-P5/32

  - [[16, 19, 22], 1, YOLODLADetect, [nc]]
